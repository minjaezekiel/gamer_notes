<!doctype html>
<!-- ===========================================================================
     03-ship-feel.html — four sliders, four presets, one ship.

     WHAT THIS DEMONSTRATES
     That "game feel" is not a different kind of code. It is the same six lines
     with different numbers in them. Fly all four presets and the same program
     becomes a spaceship, a car, a sheet of ice and something snappy.

     It also shows the two readouts that make tuning possible instead of
     guesswork:
         settled speed = THRUST / DRAG      (where the ship ends up)
         half-life     = 0.693 / DRAG       (how long to lose half its speed)

     HOW TO RUN IT
     Double-click. Arrow keys fly. Keys 1-4 load presets. T toggles the trail.

     WHAT TO CHANGE FIRST
     Set DRAG low and MAX SPEED low, then hold thrust: the ship hits the speed
     limit and the clamp does the work. Now raise DRAG past THRUST/MAX and the
     limit stops mattering at all, because drag gets there first. The readout
     tells you which of the two is in charge.
     ======================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ship feel</title>
<style>
  body { background: #11151c; color: #e7ecf3; font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; }
  canvas { background: #0a0d12; border: 2px solid #2b3240; border-radius: 6px; }
  #panel { display: grid; grid-template-columns: 150px 220px 90px; gap: 6px 12px;
           align-items: center; font-size: 14px; }
  #panel span:first-child { color: #a9b4c4; }
  #panel output { font-family: ui-monospace, Menlo, monospace; color: #ffd43b; }
  #presets { display: flex; gap: 8px; }
  button { background: #1b2130; color: #e7ecf3; border: 1px solid #2b3240;
           border-radius: 6px; padding: 7px 12px; font-size: 14px; cursor: pointer; }
  button:hover { background: #253044; }
  p { max-width: 620px; font-size: 14px; line-height: 1.5; color: #a9b4c4; }
</style>
</head>
<body>
<h1>Tune it until it feels right</h1>
<canvas id="game" width="660" height="380"></canvas>

<div id="presets">
  <button data-preset="0">1 — Spaceship</button>
  <button data-preset="1">2 — Car</button>
  <button data-preset="2">3 — Ice</button>
  <button data-preset="3">4 — Snappy</button>
</div>

<div id="panel">
  <span>THRUST (px/s per s)</span>
  <input id="thrust" type="range" min="100" max="5000" step="20" value="900">
  <output id="thrustOut">900</output>

  <span>DRAG (per second)</span>
  <input id="drag" type="range" min="0" max="20" step="0.05" value="2.5">
  <output id="dragOut">2.5</output>

  <span>MAX SPEED (px/s)</span>
  <input id="max" type="range" min="60" max="900" step="10" value="380">
  <output id="maxOut">380</output>

  <span>TURN SPEED (rad/s)</span>
  <input id="turn" type="range" min="0.5" max="12" step="0.1" value="3.2">
  <output id="turnOut">3.2</output>
</div>

<p>Arrow keys to fly &middot; <b>1&ndash;4</b> for presets &middot; <b>T</b> toggles the trail.
   Write your own four numbers down when you find a set you like.</p>

<script>
class Vec2 {
  constructor(x, y) { this.x = x; this.y = y; }
  add(o)   { return new Vec2(this.x + o.x, this.y + o.y); }
  scale(k) { return new Vec2(this.x * k, this.y * k); }
  length() { return Math.hypot(this.x, this.y); }
  normalise() {
    const l = this.length();
    return l === 0 ? new Vec2(0, 0) : new Vec2(this.x / l, this.y / l);
  }
  static fromAngle(r) { return new Vec2(Math.cos(r), Math.sin(r)); }
}

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

/* The presets. Four numbers each; nothing else changes. */
const PRESETS = [
  { name: "Spaceship", thrust: 420,  drag: 0.3,  max: 500, turn: 2.6 },
  { name: "Car",       thrust: 900,  drag: 2.5,  max: 380, turn: 3.2 },
  { name: "Ice",       thrust: 300,  drag: 0.15, max: 450, turn: 2.0 },
  { name: "Snappy",    thrust: 4000, drag: 14,   max: 320, turn: 7.0 }
];

const ui = {
  thrust: document.getElementById("thrust"),
  drag:   document.getElementById("drag"),
  max:    document.getElementById("max"),
  turn:   document.getElementById("turn")
};
const outs = {
  thrust: document.getElementById("thrustOut"),
  drag:   document.getElementById("dragOut"),
  max:    document.getElementById("maxOut"),
  turn:   document.getElementById("turnOut")
};

function syncOutputs() {
  Object.keys(ui).forEach(function (k) { outs[k].textContent = ui[k].value; });
}
Object.keys(ui).forEach(function (k) {
  ui[k].addEventListener("input", syncOutputs);
});
syncOutputs();

let presetName = "Car";
function loadPreset(i) {
  const p = PRESETS[i];
  ui.thrust.value = p.thrust;
  ui.drag.value = p.drag;
  ui.max.value = p.max;
  ui.turn.value = p.turn;
  presetName = p.name;
  syncOutputs();
}
document.querySelectorAll("#presets button").forEach(function (b) {
  b.addEventListener("click", function () { loadPreset(Number(b.dataset.preset)); });
});

const ship = { pos: new Vec2(330, 190), vel: new Vec2(0, 0), angle: -Math.PI / 2 };
let trail = [];
let showTrail = true;
let topSeen = 0;

const keys = {};
document.addEventListener("keydown", function (e) {
  keys[e.key] = true;
  if (e.key.startsWith("Arrow")) { e.preventDefault(); }
  if (e.key >= "1" && e.key <= "4") { loadPreset(Number(e.key) - 1); }
  if (e.key === "t" || e.key === "T") { showTrail = !showTrail; }
});
document.addEventListener("keyup", function (e) { keys[e.key] = false; });

function update(dt) {
  const THRUST = Number(ui.thrust.value);
  const DRAG = Number(ui.drag.value);
  const MAX_SPEED = Number(ui.max.value);
  const TURN_SPEED = Number(ui.turn.value);

  /* ---- 1. turn ---- */
  if (keys["ArrowLeft"])  { ship.angle -= TURN_SPEED * dt; }
  if (keys["ArrowRight"]) { ship.angle += TURN_SPEED * dt; }

  /* ---- 2. build the acceleration, starting from nothing ----
     Every push gets added here. Add gravity or wind and they combine for free. */
  let acceleration = new Vec2(0, 0);
  if (keys["ArrowUp"]) {
    acceleration = acceleration.add(Vec2.fromAngle(ship.angle).scale(THRUST));
  }
  if (keys["ArrowDown"]) {
    // a reverse thruster, deliberately weaker
    acceleration = acceleration.add(Vec2.fromAngle(ship.angle).scale(-THRUST * 0.4));
  }

  /* ---- 3. acceleration -> velocity ---- */
  ship.vel = ship.vel.add(acceleration.scale(dt));

  /* ---- 4. drag, per SECOND ---- */
  ship.vel = ship.vel.scale(Math.exp(-DRAG * dt));

  /* ---- 5. limit the LENGTH, not x and y ---- */
  if (ship.vel.length() > MAX_SPEED) {
    ship.vel = ship.vel.normalise().scale(MAX_SPEED);
  }

  /* ---- 6. velocity -> position. Always last. ---- */
  ship.pos = ship.pos.add(ship.vel.scale(dt));

  // wrap around the edges
  if (ship.pos.x < 0) { ship.pos.x += canvas.width; trail = []; }
  if (ship.pos.x > canvas.width) { ship.pos.x -= canvas.width; trail = []; }
  if (ship.pos.y < 0) { ship.pos.y += canvas.height; trail = []; }
  if (ship.pos.y > canvas.height) { ship.pos.y -= canvas.height; trail = []; }

  topSeen = Math.max(topSeen, ship.vel.length());
  if (ship.vel.length() > 3) {
    trail.push(new Vec2(ship.pos.x, ship.pos.y));
    if (trail.length > 200) { trail.shift(); }
  }
}

function draw() {
  const THRUST = Number(ui.thrust.value);
  const DRAG = Number(ui.drag.value);
  const MAX_SPEED = Number(ui.max.value);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (showTrail) {
    for (let i = 0; i < trail.length; i++) {
      ctx.globalAlpha = 0.03 + 0.3 * (i / trail.length);
      ctx.fillStyle = "#4dabf7";
      ctx.beginPath();
      ctx.arc(trail[i].x, trail[i].y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  ctx.save();
  ctx.translate(ship.pos.x, ship.pos.y);
  ctx.rotate(ship.angle);
  ctx.strokeStyle = "#e7ecf3";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(16, 0);
  ctx.lineTo(-11, 9);
  ctx.lineTo(-6, 0);
  ctx.lineTo(-11, -9);
  ctx.closePath();
  ctx.stroke();
  if (keys["ArrowUp"]) {
    ctx.strokeStyle = "#ff9f43";
    ctx.beginPath();
    ctx.moveTo(-7, 0);
    ctx.lineTo(-17 - Math.random() * 8, 0);
    ctx.stroke();
  }
  ctx.restore();

  const speed = ship.vel.length();

  /* The readouts that make this tunable rather than a guess. */
  const settled = DRAG > 0 ? THRUST / DRAG : Infinity;
  const halfLife = DRAG > 0 ? Math.LN2 / DRAG : Infinity;
  const limitedBy = settled > MAX_SPEED ? "the SPEED LIMIT" : "DRAG";

  ctx.font = "bold 15px ui-monospace, Menlo, monospace";
  ctx.fillStyle = "#e7ecf3";
  ctx.fillText("speed " + speed.toFixed(0).padStart(4), 14, 28);

  ctx.font = "12.5px ui-monospace, Menlo, monospace";
  ctx.fillStyle = "#8793a4";
  ctx.fillText("fastest seen        " + topSeen.toFixed(0), 14, 50);
  ctx.fillText("THRUST / DRAG     = " +
    (settled === Infinity ? "no limit" : settled.toFixed(0) + " px/s"), 14, 68);
  ctx.fillText("half-life         = " +
    (halfLife === Infinity ? "never" : halfLife.toFixed(2) + " s"), 14, 86);
  ctx.fillStyle = "#ffd43b";
  ctx.fillText("top speed set by    " + limitedBy, 14, 104);

  ctx.fillStyle = "#8793a4";
  ctx.font = "13px system-ui, sans-serif";
  ctx.fillText("preset: " + presetName, 14, canvas.height - 14);

  // a speed bar, so a change in feel is visible as well as felt
  const barW = 180;
  ctx.fillStyle = "#1b2130";
  ctx.fillRect(canvas.width - barW - 20, 20, barW, 14);
  ctx.fillStyle = speed >= MAX_SPEED - 1 ? "#ff6b6b" : "#51cf66";
  ctx.fillRect(canvas.width - barW - 20, 20, barW * Math.min(1, speed / MAX_SPEED), 14);
  ctx.strokeStyle = "#2b3240";
  ctx.strokeRect(canvas.width - barW - 20, 20, barW, 14);
  ctx.fillStyle = "#8793a4";
  ctx.font = "11px system-ui, sans-serif";
  ctx.fillText("speed / MAX_SPEED", canvas.width - barW - 20, 48);
}

let lastTime = 0;
function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) { dt = 0.05; }
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
