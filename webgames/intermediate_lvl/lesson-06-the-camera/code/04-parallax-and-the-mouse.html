<!doctype html>
<!-- ===========================================================================
     04-parallax-and-the-mouse.html — depth from one multiplication, and the
     conversion back.

     WHAT THIS DEMONSTRATES
       * parallax: multiply the camera offset by a factor per layer.
         0.0 never moves (sky) ... 1.0 is the world ... 1.4 is in front of it.
       * screen -> world for the mouse: worldX = screenX + camera.x
         Click to place a block. There is a switch for the un-converted version,
         whose error is zero at the start of the level and grows as you scroll -
         which is why that bug survives being tested.

     HOW TO RUN IT
     Double-click. Arrow keys to scroll, CLICK to place a block.
       U  use the un-converted mouse position (the bug)
       F  set every parallax factor to 1
       X  clear the blocks

     WHAT TO CHANGE FIRST
     Press U, click at the start of the level (correct), then scroll right and click
     again. Watch the block appear further and further from the pointer.
     ======================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parallax and the mouse</title>
<style>
  body { background: #11151c; color: #e7ecf3; font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; }
  canvas { background: #0a0d12; border: 2px solid #2b3240; border-radius: 6px; cursor: crosshair; }
  p { max-width: 650px; font-size: 14.5px; line-height: 1.5; color: #a9b4c4; }
  b { color: #ffd43b; }
</style>
</head>
<body>
<h1>Depth, and getting back again</h1>
<canvas id="game" width="660" height="410"></canvas>
<p>Arrow keys scroll &middot; <b>click</b> to place a block &middot;
   <b>U</b> un-converted mouse (the bug) &middot; <b>F</b> flatten the parallax &middot;
   <b>X</b> clear.</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WORLD_W = canvas.width * 5;
const GROUND_Y = 320;

/* Four layers, each with its own factor. The factor is the whole of parallax. */
const LAYERS = [
  { name: "sky",   factor: 0.0,  colour: "#141b26", items: [] },
  { name: "hills", factor: 0.25, colour: "#1d2a3a", items: [] },
  { name: "trees", factor: 0.55, colour: "#24384a", items: [] },
  { name: "world", factor: 1.0,  colour: "#36506b", items: [] },
  { name: "grass", factor: 1.35, colour: "#4a7a5c", items: [] }
];

/* fill each layer with shapes, in world coordinates */
for (let L = 0; L < LAYERS.length; L++) {
  const layer = LAYERS[L];
  const count = layer.name === "sky" ? 16 : 40;
  for (let i = 0; i < count; i++) {
    layer.items.push({
      x: (i / count) * WORLD_W + (i % 5) * 37,
      size: 20 + ((i * 29 + L * 13) % 70),
      h: 30 + ((i * 17 + L * 31) % 90)
    });
  }
}

const camera = { x: 0 };
const blocks = [];
let flatten = false;
let unconverted = false;
let lastClick = null;

const keys = {};
document.addEventListener("keydown", function (e) {
  keys[e.key] = true;
  if (e.key.startsWith("Arrow")) { e.preventDefault(); }
  if (e.key === "u" || e.key === "U") { unconverted = !unconverted; }
  if (e.key === "f" || e.key === "F") { flatten = !flatten; }
  if (e.key === "x" || e.key === "X") { blocks.length = 0; }
});
document.addEventListener("keyup", function (e) { keys[e.key] = false; });

canvas.addEventListener("click", function (e) {
  const b = canvas.getBoundingClientRect();
  const screenX = e.clientX - b.left;
  const screenY = e.clientY - b.top;

  /* THE CONVERSION BACK. The mouse always arrives in screen space. */
  const worldX = unconverted ? screenX : screenX + camera.x;

  blocks.push({ x: worldX, y: screenY, w: 24, h: 24 });
  lastClick = { screenX: screenX, screenY: screenY, worldX: worldX };
});

function update(dt) {
  const SPEED = 420;
  if (keys["ArrowRight"]) { camera.x += SPEED * dt; }
  if (keys["ArrowLeft"])  { camera.x -= SPEED * dt; }
  camera.x = Math.max(0, Math.min(WORLD_W - canvas.width, camera.x));
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#0d131c";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let L = 0; L < LAYERS.length; L++) {
    const layer = LAYERS[L];
    const factor = flatten ? 1 : layer.factor;
    /* ONE MULTIPLICATION. That is all parallax is. */
    const offset = camera.x * factor;

    ctx.fillStyle = layer.colour;
    for (let i = 0; i < layer.items.length; i++) {
      const it = layer.items[i];
      const sx = it.x - offset;
      if (sx < -200 || sx > canvas.width + 200) { continue; }

      if (layer.name === "sky") {
        ctx.beginPath();
        ctx.arc(sx, 60 + (i % 3) * 26, it.size * 0.25, 0, Math.PI * 2);
        ctx.fill();
      } else if (layer.name === "grass") {
        ctx.fillRect(sx, GROUND_Y + 30, 3, 14);
      } else {
        ctx.beginPath();
        ctx.moveTo(sx - it.size / 2, GROUND_Y + 30);
        ctx.lineTo(sx, GROUND_Y + 30 - it.h);
        ctx.lineTo(sx + it.size / 2, GROUND_Y + 30);
        ctx.fill();
      }
    }
  }

  ctx.fillStyle = "#1a2230";
  ctx.fillRect(0, GROUND_Y + 30, canvas.width, canvas.height - GROUND_Y - 30);

  /* the blocks live in the world layer, so factor 1 */
  for (let i = 0; i < blocks.length; i++) {
    const sx = blocks[i].x - camera.x;
    if (sx < -40 || sx > canvas.width) { continue; }
    ctx.fillStyle = "#ffd43b";
    ctx.fillRect(Math.round(sx), blocks[i].y, blocks[i].w, blocks[i].h);
  }

  /* ---- the readout ---- */
  ctx.fillStyle = "rgba(10,13,18,0.9)";
  ctx.fillRect(10, 10, 268, 150);
  ctx.strokeStyle = "#2b3240";
  ctx.lineWidth = 1;
  ctx.strokeRect(10, 10, 268, 150);

  ctx.font = "bold 12.5px system-ui, sans-serif";
  ctx.fillStyle = "#e7ecf3";
  ctx.fillText("PARALLAX FACTORS", 22, 30);
  ctx.font = "12px ui-monospace, Menlo, monospace";
  for (let L = 0; L < LAYERS.length; L++) {
    const f = flatten ? 1 : LAYERS[L].factor;
    ctx.fillStyle = LAYERS[L].colour === "#141b26" ? "#8793a4" : LAYERS[L].colour;
    ctx.fillText(LAYERS[L].name.padEnd(7) + f.toFixed(2), 22, 48 + L * 17);
  }

  ctx.fillStyle = "#8793a4";
  ctx.fillText("camera  " + Math.round(camera.x), 22, 150);

  const px = 300;
  ctx.font = "bold 12.5px system-ui, sans-serif";
  ctx.fillStyle = unconverted ? "#ff6b6b" : "#51cf66";
  ctx.fillText(unconverted ? "MOUSE: not converted (bug)" : "MOUSE: converted to world", px, 30);
  ctx.font = "12px ui-monospace, Menlo, monospace";
  ctx.fillStyle = "#8793a4";
  ctx.fillText(unconverted ? "worldX = screenX" : "worldX = screenX + camera.x", px, 48);

  if (lastClick) {
    ctx.fillStyle = "#6b7480";
    ctx.fillText("last click screen x  " + Math.round(lastClick.screenX), px, 72);
    ctx.fillStyle = unconverted ? "#ff6b6b" : "#51cf66";
    ctx.fillText("stored as world x    " + Math.round(lastClick.worldX), px, 90);
    if (unconverted) {
      ctx.fillStyle = "#ff6b6b";
      ctx.fillText("off by " + Math.round(camera.x) + " px", px, 108);
    }
  }

  if (flatten) {
    ctx.font = "bold 13px system-ui, sans-serif";
    ctx.fillStyle = "#f08c00";
    ctx.fillText("every factor is 1: the depth is gone", px, 140);
  }
}

let lastTime = 0;
function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) { dt = 0.05; }
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
