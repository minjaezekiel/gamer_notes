<!doctype html>
<!-- ===========================================================================
     04-death-heatmap.html — stop guessing which bit is too hard.

     WHAT THIS DEMONSTRATES
     The difference between "this bit feels hard" and "41% of all deaths are at this
     one jump".

     Every death records where it happened. The heatmap draws them. After ten
     attempts the picture tells you something you could not have known by playing,
     and the table tells you how long each attempt lasted and how far it got.

     This is a real technique. Studios run it on thousands of players; you can run it
     on six classmates, which is enough.

     HOW TO RUN IT
     Double-click. Arrows run, Space jumps. Reach the green flag.
       H  heatmap on / off
       T  the attempt table
       X  clear the data
     The data is kept in localStorage, so it survives a reload (and tells you
     nothing if storage is blocked - which it handles).

     WHAT TO CHANGE FIRST
     Play ten times without looking at the heatmap, then turn it on. Then decide
     which ONE thing you would change about the level, and say why.
     ======================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Death heatmap</title>
<style>
  body { background: #11151c; color: #e7ecf3; font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; }
  canvas { background: #0a0d12; border: 2px solid #2b3240; border-radius: 6px; }
  p { max-width: 660px; font-size: 14px; line-height: 1.5; color: #a9b4c4; }
  b { color: #ffd43b; }
</style>
</head>
<body>
<h1>Where did they die?</h1>
<canvas id="game" width="720" height="450"></canvas>
<p>Reach the green flag. <b>H</b> heatmap &middot; <b>T</b> table &middot; <b>X</b> clear.
   Play ten times <em>before</em> you look.</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const TILE = 30;

const Store = {
  available: false,
  init: function () {
    try {
      localStorage.setItem("__probe", "1");
      localStorage.removeItem("__probe");
      this.available = true;
    } catch (err) { this.available = false; }
  },
  load: function (key, fallback) {
    if (!this.available) { return fallback; }
    try {
      const t = localStorage.getItem(key);
      if (t === null) { return fallback; }
      const v = JSON.parse(t);
      return v === null ? fallback : v;
    } catch (err) { return fallback; }
  },
  save: function (key, value) {
    if (!this.available) { return false; }
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (err) { return false; }
  }
};
Store.init();

const KEY = "lesson12-playtest";

const JUMP_HEIGHT = TILE * 3.1, TIME_TO_APEX = 0.32;
const GRAVITY = (2 * JUMP_HEIGHT) / (TIME_TO_APEX * TIME_TO_APEX);
const JUMP_SPEED = GRAVITY * TIME_TO_APEX;
const RUN_SPEED = 215;

/* A level with one deliberately nasty jump in the middle, so the heatmap has
   something honest to show. */
const LEVEL = [
  "........................",
  "........................",
  "..................###...",
  "........................",
  "..........###...........",
  "........................",
  "....###.................",
  "........................",
  "###.......^^^^......###F",
  "###^^^^^^^^^^^^^^^^^^###",
  "########################"
];
const COLS = LEVEL[0].length, ROWS = LEVEL.length;

function tileAt(col, row) {
  if (col < 0 || col >= COLS) { return "#"; }
  if (row < 0) { return "."; }
  if (row >= ROWS) { return "#"; }
  return LEVEL[row].charAt(col);
}
function isSolid(col, row) {
  const t = tileAt(col, row);
  return t === "#";
}

const START = { x: TILE * 1.2, y: TILE * 6.5 };
const player = { x: START.x, y: START.y, w: 20, h: 26, vx: 0, vy: 0,
                 onGround: false, coyote: 0, buffer: 0 };

let data = Store.load(KEY, { deaths: [], attempts: [] });
if (!data || !Array.isArray(data.deaths) || !Array.isArray(data.attempts)) {
  data = { deaths: [], attempts: [] };
}

let attemptStart = performance.now();
let bestX = START.x;
let showHeatmap = false;
let showTable = false;
let won = false;
let message = "";

const keys = {};
document.addEventListener("keydown", function (e) {
  if (e.key === " " && !keys[" "]) { player.buffer = 0.12; }
  keys[e.key] = true;
  if (e.key.startsWith("Arrow") || e.key === " ") { e.preventDefault(); }
  if (e.key === "h" || e.key === "H") { showHeatmap = !showHeatmap; }
  if (e.key === "t" || e.key === "T") { showTable = !showTable; }
  if (e.key === "x" || e.key === "X") {
    data = { deaths: [], attempts: [] };
    Store.save(KEY, data);
    message = "data cleared";
  }
  if (e.key === "r" || e.key === "R") { respawn(false); }
});
document.addEventListener("keyup", function (e) { keys[e.key] = false; });

function recordAttempt(outcome) {
  const seconds = (performance.now() - attemptStart) / 1000;
  data.attempts.push({
    outcome: outcome,
    seconds: Math.round(seconds * 10) / 10,
    reached: Math.round(bestX)
  });
  if (data.attempts.length > 60) { data.attempts.shift(); }
  Store.save(KEY, data);
}

function die() {
  data.deaths.push({ x: Math.round(player.x), y: Math.round(player.y) });
  if (data.deaths.length > 400) { data.deaths.shift(); }
  recordAttempt("died");
  respawn(true);
}

function respawn(died) {
  player.x = START.x; player.y = START.y;
  player.vx = 0; player.vy = 0;
  player.coyote = 0; player.buffer = 0;
  attemptStart = performance.now();
  bestX = START.x;
  won = false;
  message = died ? "died — attempt " + (data.attempts.length + 1) : "";
}

function overlapSolid(box) {
  const c0 = Math.floor(box.x / TILE);
  const c1 = Math.floor((box.x + box.w - 0.001) / TILE);
  const r0 = Math.floor(box.y / TILE);
  const r1 = Math.floor((box.y + box.h - 0.001) / TILE);
  for (let row = r0; row <= r1; row++) {
    for (let col = c0; col <= c1; col++) {
      if (isSolid(col, row)) { return { col: col, row: row }; }
    }
  }
  return null;
}

function touching(ch) {
  const c0 = Math.floor(player.x / TILE);
  const c1 = Math.floor((player.x + player.w - 0.001) / TILE);
  const r0 = Math.floor(player.y / TILE);
  const r1 = Math.floor((player.y + player.h - 0.001) / TILE);
  for (let row = r0; row <= r1; row++) {
    for (let col = c0; col <= c1; col++) {
      if (tileAt(col, row) === ch) { return true; }
    }
  }
  return false;
}

function update(dt) {
  if (won) { return; }

  let wantX = 0;
  if (keys["ArrowLeft"])  { wantX -= 1; }
  if (keys["ArrowRight"]) { wantX += 1; }
  player.vx = wantX * RUN_SPEED;

  if (player.onGround) { player.coyote = 0.1; } else { player.coyote -= dt; }
  player.buffer -= dt;
  if (player.buffer > 0 && player.coyote > 0) {
    player.vy = -JUMP_SPEED;
    player.buffer = 0;
    player.coyote = 0;
  }
  if (!keys[" "] && player.vy < 0) { player.vy *= Math.pow(0.45, dt * 60); }
  player.vy += GRAVITY * (player.vy > 0 ? 1.9 : 1) * dt;

  player.x += player.vx * dt;
  const hitX = overlapSolid(player);
  if (hitX) {
    player.x = player.vx > 0 ? hitX.col * TILE - player.w : (hitX.col + 1) * TILE;
    player.vx = 0;
  }
  player.onGround = false;
  player.y += player.vy * dt;
  const hitY = overlapSolid(player);
  if (hitY) {
    if (player.vy > 0) { player.y = hitY.row * TILE - player.h; player.onGround = true; }
    else { player.y = (hitY.row + 1) * TILE; }
    player.vy = 0;
  }

  bestX = Math.max(bestX, player.x);

  if (touching("^")) { die(); return; }
  if (player.y > ROWS * TILE + 80) { die(); return; }
  if (touching("F")) {
    won = true;
    recordAttempt("won");
    message = "reached the flag";
  }
}

function drawHeatmap() {
  /* Count deaths per cell, so the hottest spots are obvious rather than being a
     pile of overlapping dots. */
  const counts = {};
  let worst = 0, worstKey = null;
  for (let i = 0; i < data.deaths.length; i++) {
    const d = data.deaths[i];
    const key = Math.floor(d.x / TILE) + "," + Math.floor(d.y / TILE);
    counts[key] = (counts[key] || 0) + 1;
    if (counts[key] > worst) { worst = counts[key]; worstKey = key; }
  }
  const keysOf = Object.keys(counts);
  for (let i = 0; i < keysOf.length; i++) {
    const parts = keysOf[i].split(",");
    const cx = Number(parts[0]) * TILE + TILE / 2;
    const cy = Number(parts[1]) * TILE + TILE / 2;
    const heat = counts[keysOf[i]] / Math.max(1, worst);
    ctx.globalAlpha = 0.18 + 0.52 * heat;
    ctx.fillStyle = heat > 0.66 ? "#ff6b6b" : (heat > 0.33 ? "#ff9f43" : "#ffd43b");
    ctx.beginPath();
    ctx.arc(cx, cy, 10 + 16 * heat, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = "bold 11px ui-monospace, Menlo, monospace";
    ctx.fillStyle = "#11151c";
    ctx.fillText(String(counts[keysOf[i]]), cx - 4, cy + 4);
  }
  return { worst: worst, worstKey: worstKey, total: data.deaths.length };
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#0f141b";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const t = tileAt(col, row);
      if (t === "#") {
        ctx.fillStyle = "#3c4756";
        ctx.fillRect(col * TILE, row * TILE, TILE, TILE);
      } else if (t === "^") {
        ctx.fillStyle = "#7c2d2d";
        ctx.fillRect(col * TILE, row * TILE, TILE, TILE);
        ctx.fillStyle = "#ff6b6b";
        for (let k = 0; k < 3; k++) {
          ctx.beginPath();
          ctx.moveTo(col * TILE + 2 + k * 9, row * TILE + TILE);
          ctx.lineTo(col * TILE + 6 + k * 9, row * TILE + TILE - 11);
          ctx.lineTo(col * TILE + 10 + k * 9, row * TILE + TILE);
          ctx.fill();
        }
      } else if (t === "F") {
        ctx.fillStyle = "#51cf66";
        ctx.fillRect(col * TILE + 6, row * TILE, 4, TILE);
        ctx.fillRect(col * TILE + 10, row * TILE + 2, 14, 10);
      }
    }
  }

  let stats = { worst: 0, worstKey: null, total: data.deaths.length };
  if (showHeatmap) { stats = drawHeatmap(); }

  ctx.fillStyle = won ? "#51cf66" : "#4dabf7";
  ctx.fillRect(Math.round(player.x), Math.round(player.y), player.w, player.h);

  /* ---- the numbers ---- */
  let wins = 0, totalTime = 0;
  for (let i = 0; i < data.attempts.length; i++) {
    if (data.attempts[i].outcome === "won") { wins += 1; }
    totalTime += data.attempts[i].seconds;
  }

  ctx.fillStyle = "rgba(10,13,18,0.93)";
  ctx.fillRect(10, 10, 268, 126);
  ctx.strokeStyle = "#2b3240";
  ctx.lineWidth = 1;
  ctx.strokeRect(10, 10, 268, 126);

  ctx.font = "bold 13px system-ui, sans-serif";
  ctx.fillStyle = "#e7ecf3";
  ctx.fillText("PLAYTEST DATA", 22, 30);
  ctx.font = "12px ui-monospace, Menlo, monospace";
  ctx.fillStyle = "#8793a4";
  ctx.fillText("attempts   " + data.attempts.length, 22, 52);
  ctx.fillText("deaths     " + data.deaths.length, 22, 68);
  ctx.fillText("wins       " + wins, 22, 84);
  ctx.fillText("avg length " +
    (data.attempts.length ? (totalTime / data.attempts.length).toFixed(1) + " s" : "-"), 22, 100);
  ctx.fillStyle = showHeatmap ? "#51cf66" : "#4a5362";
  ctx.fillText("heatmap    " + (showHeatmap ? "on (H)" : "off (H)"), 22, 116);
  ctx.fillStyle = Store.available ? "#4a5362" : "#f08c00";
  ctx.fillText(Store.available ? "saved to storage" : "storage blocked: this session only",
               22, 132);

  if (showHeatmap && stats.worst > 1) {
    const share = Math.round(100 * stats.worst / Math.max(1, stats.total));
    ctx.font = "bold 13px system-ui, sans-serif";
    ctx.fillStyle = "#ff6b6b";
    ctx.fillText(share + "% of all deaths are in ONE cell", 296, 30);
    ctx.font = "12.5px system-ui, sans-serif";
    ctx.fillStyle = "#a9b4c4";
    ctx.fillText("that is not a difficulty curve, it is a design problem", 296, 50);
  }

  if (showTable) {
    const rows = data.attempts.slice(-12);
    ctx.fillStyle = "rgba(10,13,18,0.93)";
    ctx.fillRect(canvas.width - 250, 10, 240, 30 + rows.length * 16);
    ctx.strokeStyle = "#2b3240";
    ctx.strokeRect(canvas.width - 250, 10, 240, 30 + rows.length * 16);
    ctx.font = "bold 12px system-ui, sans-serif";
    ctx.fillStyle = "#e7ecf3";
    ctx.fillText("LAST ATTEMPTS", canvas.width - 238, 28);
    ctx.font = "11.5px ui-monospace, Menlo, monospace";
    for (let i = 0; i < rows.length; i++) {
      const a = rows[i];
      ctx.fillStyle = a.outcome === "won" ? "#51cf66" : "#ff6b6b";
      ctx.fillText(String(i + 1).padStart(2) + "  " + a.outcome.padEnd(5) +
                   "  " + String(a.seconds).padStart(5) + "s  x" + a.reached,
                   canvas.width - 238, 46 + i * 16);
    }
  }

  ctx.font = "13px system-ui, sans-serif";
  ctx.fillStyle = won ? "#51cf66" : "#f08c00";
  if (message) { ctx.fillText(message, 22, canvas.height - 34); }
  ctx.font = "12px system-ui, sans-serif";
  ctx.fillStyle = "#4a5362";
  ctx.fillText(won ? "press R to play again"
                   : "T shows the attempt table · X clears the data", 22, canvas.height - 14);
}

let lastTime = 0;
function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) { dt = 0.05; }
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
