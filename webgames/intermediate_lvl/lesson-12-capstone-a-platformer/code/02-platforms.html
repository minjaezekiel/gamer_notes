<!doctype html>
<!-- ===========================================================================
     02-platforms.html — one-way and moving platforms.

     WHAT THIS DEMONSTRATES
       * a ONE-WAY platform needs two things an ordinary solid test does not: the
         direction of travel, and WHERE THE PLAYER WAS before the move. Without the
         second one, jumping up through it snaps you onto its top.
       * a MOVING platform needs an ORDER: move the platforms, carry the passengers,
         then move the player. Get it backwards and the player sinks into a rising
         platform and is left behind by a falling one.

     Both mistakes are on switches, so you can see each failure happen.

     HOW TO RUN IT
     Double-click. Arrows run, Space jumps, Down drops through a one-way platform.
       W  remove the "was above" test (the one-way bug)
       O  move the player BEFORE the platforms (the ordering bug)
       R  reset

     WHAT TO CHANGE FIRST
     Press W and jump up through the thin yellow platform. Then press O and stand on
     the moving one.
     ======================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Platforms</title>
<style>
  body { background: #11151c; color: #e7ecf3; font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; }
  canvas { background: #0a0d12; border: 2px solid #2b3240; border-radius: 6px; }
  p { max-width: 660px; font-size: 14px; line-height: 1.5; color: #a9b4c4; }
  b { color: #ffd43b; }
</style>
</head>
<body>
<h1>Through, and along</h1>
<canvas id="game" width="720" height="440"></canvas>
<p>Arrows &middot; <b>Space</b> jump &middot; <b>Down</b> drop through &middot;
   <b>W</b> the one-way bug &middot; <b>O</b> the ordering bug &middot; <b>R</b> reset.</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const TILE = 32;

const JUMP_HEIGHT = TILE * 3.2, TIME_TO_APEX = 0.33;
const GRAVITY = (2 * JUMP_HEIGHT) / (TIME_TO_APEX * TIME_TO_APEX);
const JUMP_SPEED = GRAVITY * TIME_TO_APEX;
const RUN_SPEED = 230;

/* '#' solid, '=' one-way (solid only from above) */
const LEVEL = [
  "......................",
  "......................",
  "......====............",
  "......................",
  "...====....====.......",
  "......................",
  "###...................",
  "..#......====.........",
  "..#...................",
  "..#...........====....",
  "######################"
];
const COLS = LEVEL[0].length, ROWS = LEVEL.length;

function tileAt(col, row) {
  if (col < 0 || col >= COLS) { return "#"; }
  if (row < 0) { return "."; }
  if (row >= ROWS) { return "#"; }
  return LEVEL[row].charAt(col);
}

/* Moving platforms are entities, not tiles - which is the answer to lesson 5's
   question about tiles that need behaviour rather than properties. */
const platforms = [
  { x: TILE * 11, y: TILE * 7.2, w: TILE * 3, h: 12, vx: 0, vy: -55, minY: TILE * 3, maxY: TILE * 8 },
  { x: TILE * 4,  y: TILE * 9,   w: TILE * 3, h: 12, vx: 90, vy: 0, minX: TILE * 4, maxX: TILE * 14 }
];

const player = {
  x: TILE * 1.2, y: TILE * 5, w: 22, h: 30,
  vx: 0, vy: 0, onGround: false, riding: null, prevBottom: 0
};

let noWasAbove = false;
let playerFirst = false;
let dropping = 0;
const keys = {};

document.addEventListener("keydown", function (e) {
  if (e.key === " " && !keys[" "] && player.onGround) { player.vy = -JUMP_SPEED; }
  if (e.key === "ArrowDown" && !keys["ArrowDown"]) { dropping = 0.2; }
  keys[e.key] = true;
  if (e.key.startsWith("Arrow") || e.key === " ") { e.preventDefault(); }
  if (e.key === "w" || e.key === "W") { noWasAbove = !noWasAbove; }
  if (e.key === "o" || e.key === "O") { playerFirst = !playerFirst; }
  if (e.key === "r" || e.key === "R") {
    player.x = TILE * 1.2; player.y = TILE * 5; player.vy = 0; player.riding = null;
  }
});
document.addEventListener("keyup", function (e) { keys[e.key] = false; });

/* ---------------------------------------------------------------------------
   The tile test. A one-way tile is solid only when BOTH:
     * we are moving down, and
     * our bottom edge was above its top edge before this frame's move.
   Dropping through deliberately switches it off for a moment.
   ------------------------------------------------------------------------ */
function blockedBy(col, row, movingDown) {
  const t = tileAt(col, row);
  if (t === "#") { return true; }
  if (t !== "=") { return false; }
  if (dropping > 0) { return false; }
  if (!movingDown) { return false; }
  if (noWasAbove) { return true; }              /* THE BUG, on a switch */
  const topEdge = row * TILE;
  return player.prevBottom <= topEdge + 1;
}

function overlap(box, movingDown) {
  const c0 = Math.floor(box.x / TILE);
  const c1 = Math.floor((box.x + box.w - 0.001) / TILE);
  const r0 = Math.floor(box.y / TILE);
  const r1 = Math.floor((box.y + box.h - 0.001) / TILE);
  for (let row = r0; row <= r1; row++) {
    for (let col = c0; col <= c1; col++) {
      if (blockedBy(col, row, movingDown)) { return { col: col, row: row }; }
    }
  }
  return null;
}

function movePlatforms(dt) {
  for (let i = 0; i < platforms.length; i++) {
    const p = platforms[i];
    const dx = p.vx * dt, dy = p.vy * dt;
    p.x += dx;
    p.y += dy;
    if (p.minY !== undefined && (p.y < p.minY || p.y > p.maxY)) { p.vy = -p.vy; }
    if (p.minX !== undefined && (p.x < p.minX || p.x > p.maxX)) { p.vx = -p.vx; }

    /* CARRY THE PASSENGER by the same amount. riding is set by the downward
       collision test below - the same test that sets onGround. */
    if (player.riding === p) {
      player.x += dx;
      player.y += dy;
    }
  }
}

function movePlayer(dt) {
  let wantX = 0;
  if (keys["ArrowLeft"])  { wantX -= 1; }
  if (keys["ArrowRight"]) { wantX += 1; }
  player.vx = wantX * RUN_SPEED;
  player.vy += GRAVITY * (player.vy > 0 ? 1.9 : 1) * dt;

  player.prevBottom = player.y + player.h;

  player.x += player.vx * dt;
  const hitX = overlap(player, false);
  if (hitX) {
    player.x = player.vx > 0 ? hitX.col * TILE - player.w : (hitX.col + 1) * TILE;
    player.vx = 0;
  }

  player.onGround = false;
  const wasRiding = player.riding;
  player.riding = null;
  player.y += player.vy * dt;
  const hitY = overlap(player, player.vy > 0);
  if (hitY) {
    if (player.vy > 0) { player.y = hitY.row * TILE - player.h; player.onGround = true; }
    else { player.y = (hitY.row + 1) * TILE; }
    player.vy = 0;
  }

  /* moving platforms, tested as boxes rather than tiles */
  for (let i = 0; i < platforms.length; i++) {
    const p = platforms[i];
    const overlapping = player.x < p.x + p.w && player.x + player.w > p.x &&
                        player.y + player.h > p.y && player.y < p.y + p.h;
    if (!overlapping) { continue; }
    const cameFromAbove = player.prevBottom <= p.y + 2 || wasRiding === p;
    if (player.vy >= 0 && cameFromAbove && dropping <= 0) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
      player.riding = p;
    }
  }

  if (player.y > ROWS * TILE + 120) {
    player.x = TILE * 1.2; player.y = TILE * 5; player.vy = 0;
  }
}

function update(dt) {
  if (dropping > 0) { dropping -= dt; }

  /* ---- THE ORDER. Platforms first, then the player. ---- */
  if (playerFirst) {
    movePlayer(dt);
    movePlatforms(dt);
  } else {
    movePlatforms(dt);
    movePlayer(dt);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#0f141b";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const t = tileAt(col, row);
      if (t === "#") {
        ctx.fillStyle = "#3c4756";
        ctx.fillRect(col * TILE, row * TILE, TILE, TILE);
      } else if (t === "=") {
        ctx.fillStyle = noWasAbove ? "#c92a2a" : "#b58900";
        ctx.fillRect(col * TILE, row * TILE, TILE, 7);
      }
    }
  }

  for (let i = 0; i < platforms.length; i++) {
    const p = platforms[i];
    ctx.fillStyle = player.riding === p ? "#51cf66" : "#7a5cff";
    ctx.fillRect(p.x, p.y, p.w, p.h);
  }

  ctx.fillStyle = player.onGround ? "#51cf66" : "#4dabf7";
  ctx.fillRect(Math.round(player.x), Math.round(player.y), player.w, player.h);
  if (dropping > 0) {
    ctx.strokeStyle = "#ffd43b";
    ctx.lineWidth = 2;
    ctx.strokeRect(Math.round(player.x) - 2, Math.round(player.y) - 2,
                   player.w + 4, player.h + 4);
  }

  ctx.fillStyle = "rgba(10,13,18,0.93)";
  ctx.fillRect(canvas.width - 300, 10, 290, 118);
  ctx.strokeStyle = "#2b3240";
  ctx.lineWidth = 1;
  ctx.strokeRect(canvas.width - 300, 10, 290, 118);
  const px = canvas.width - 288;

  ctx.font = "12px ui-monospace, Menlo, monospace";
  ctx.fillStyle = noWasAbove ? "#ff6b6b" : "#51cf66";
  ctx.fillText((noWasAbove ? "[x] " : "[ ] ") + "W  no 'was above' test", px, 32);
  ctx.fillStyle = playerFirst ? "#ff6b6b" : "#51cf66";
  ctx.fillText((playerFirst ? "[x] " : "[ ] ") + "O  player before platforms", px, 50);

  ctx.fillStyle = "#8793a4";
  ctx.fillText("riding     " + (player.riding ? "yes" : "no"), px, 76);
  ctx.fillText("onGround   " + player.onGround, px, 92);
  ctx.fillText("prevBottom " + Math.round(player.prevBottom), px, 108);
  ctx.fillStyle = "#4a5362";
  ctx.fillText("Down to drop through", px, 124);

  ctx.font = "12.5px system-ui, sans-serif";
  if (noWasAbove) {
    ctx.fillStyle = "#ff6b6b";
    ctx.fillText("jump up through a yellow platform: you snap onto its top, because",
                 16, canvas.height - 32);
    ctx.fillText("'moving down' becomes true at the apex while you are inside it.",
                 16, canvas.height - 14);
  } else if (playerFirst) {
    ctx.fillStyle = "#ff6b6b";
    ctx.fillText("stand on the purple platforms: the player is collided against their",
                 16, canvas.height - 32);
    ctx.fillText("OLD position, so a rising platform moves into them.", 16, canvas.height - 14);
  } else {
    ctx.fillStyle = "#4a5362";
    ctx.fillText("platforms move, then carry their passenger, then the player moves",
                 16, canvas.height - 14);
  }
}

let lastTime = 0;
function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) { dt = 0.05; }
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
