<!doctype html>
<!-- ==========================================================================
     01 - The four conditions, one at a time
     Lesson 4, Web Games, Beginner

     WHAT THIS SHOWS:  The AABB test with each condition displayed separately,
                       so you can see which one is failing.
     RUN IT:           Double-click, then drag the orange box with the mouse.
     TRY THIS:         Find a position where exactly THREE conditions are true
                       and one is false. That position is the case your game
                       gets wrong if you forget a condition.
     ========================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>01 - Boxes overlap</title>
<style>
  body { background:#f0f0f0; font-family:system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:24px; }
  canvas { border:2px solid #888; }
  p { max-width:620px; }
</style>
</head>
<body>

<h1>01 - Four conditions, all joined by AND</h1>
<canvas id="game" width="620" height="420"></canvas>
<p>Drag the orange box. All four conditions must be true for the boxes to count
as touching.</p>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  // Each box is {x, y, w, h}. x and y are the TOP-LEFT corner, not the centre.
  const fixed  = { x: 210, y: 150, w: 170, h: 110 };
  const moving = { x: 80,  y: 70,  w: 120, h: 90  };

  // ---- THE TEST --------------------------------------------------------
  // Write this once; use it for everything. Ball against paddle, ball against
  // brick, player against enemy, bullet against anything.
  function boxesOverlap(a, b) {
    return (
      a.x < b.x + b.w &&     // 1. a's LEFT is left of b's RIGHT
      a.x + a.w > b.x &&     // 2. a's RIGHT is right of b's LEFT
      a.y < b.y + b.h &&     // 3. a's TOP is above b's BOTTOM
      a.y + a.h > b.y        // 4. a's BOTTOM is below b's TOP
    );
  }

  // ---- dragging --------------------------------------------------------
  let dragging = false;
  canvas.addEventListener("mousedown", function () { dragging = true; });
  window.addEventListener("mouseup", function () { dragging = false; });
  canvas.addEventListener("mousemove", function (event) {
    if (!dragging) { return; }
    const bounds = canvas.getBoundingClientRect();
    moving.x = event.clientX - bounds.left - moving.w / 2;
    moving.y = event.clientY - bounds.top - moving.h / 2;
  });

  function render() {
    // Work the four conditions out SEPARATELY so each can be displayed.
    const c1 = moving.x < fixed.x + fixed.w;
    const c2 = moving.x + moving.w > fixed.x;
    const c3 = moving.y < fixed.y + fixed.h;
    const c4 = moving.y + moving.h > fixed.y;
    const hit = c1 && c2 && c3 && c4;

    ctx.fillStyle = "#222";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(74,158,255,0.35)";
    ctx.fillRect(fixed.x, fixed.y, fixed.w, fixed.h);
    ctx.fillStyle = "rgba(255,146,70,0.35)";
    ctx.fillRect(moving.x, moving.y, moving.w, moving.h);

    ctx.lineWidth = 3;
    ctx.strokeStyle = "#4a9eff";
    ctx.strokeRect(fixed.x, fixed.y, fixed.w, fixed.h);
    ctx.strokeStyle = "#ff9246";
    ctx.strokeRect(moving.x, moving.y, moving.w, moving.h);

    ctx.font = "16px ui-monospace, Menlo, monospace";
    ctx.fillStyle = "#4a9eff"; ctx.fillText("b", fixed.x + 8, fixed.y + 24);
    ctx.fillStyle = "#ff9246"; ctx.fillText("a", moving.x + 8, moving.y + 24);

    // the four lights
    const lines = [
      ["a.x < b.x + b.w", c1],
      ["a.x + a.w > b.x", c2],
      ["a.y < b.y + b.h", c3],
      ["a.y + a.h > b.y", c4]
    ];
    ctx.font = "15px ui-monospace, Menlo, monospace";
    for (let i = 0; i < lines.length; i++) {
      const y = 310 + i * 24;
      ctx.fillStyle = lines[i][1] ? "#51cf66" : "#ff6b6b";
      ctx.fillText((lines[i][1] ? "TRUE " : "FALSE") + "   " + lines[i][0], 20, y);
    }

    ctx.font = "bold 22px system-ui, sans-serif";
    ctx.fillStyle = hit ? "#ff6b6b" : "#777";
    ctx.fillText(hit ? "TOUCHING" : "not touching", 380, 340);

    ctx.font = "13px system-ui, sans-serif";
    ctx.fillStyle = "#777";
    ctx.fillText("boxesOverlap() says: " + boxesOverlap(moving, fixed), 380, 368);
  }

  function frame() { render(); requestAnimationFrame(frame); }
  frame();
</script>

</body>
</html>
