<!doctype html>
<!-- ==========================================================================
     03 - Particles and screen shake
     Lesson 5, Web Games, Beginner

     WHAT THIS SHOWS:  Two of the cheapest and most effective juice techniques,
                       with sliders so you can find out what "too much" means.
     RUN IT:           Double-click, then click anywhere on the canvas.
     TRY THIS:         Set shake duration to 1.5 seconds and click. That is why
                       the rule of thumb is about 100 MILLISECONDS.
     THEN TRY:         Tick "scatter into a square" and look carefully at the
                       shape of the spray. The cos/sin version gives an even
                       circle; the naive version clumps towards the corners.
     ========================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>03 - Particles and shake</title>
<style>
  body { background:#f0f0f0; font-family:system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:24px; }
  canvas { border:2px solid #888; cursor: crosshair; }
  p, .controls { max-width:620px; }
  .controls { margin-top:12px; font-size:14px; display:flex; flex-wrap:wrap; gap:14px; }
  label { display:inline-flex; align-items:center; gap:6px; }
</style>
</head>
<body>

<h1>03 - Particles and screen shake</h1>
<canvas id="game" width="620" height="380"></canvas>
<div class="controls">
  <label>particles <input id="count" type="range" min="0" max="120" step="4" value="16">
    <output id="countOut">16</output></label>
  <label>shake strength <input id="str" type="range" min="0" max="30" value="7">
    <output id="strOut">7</output></label>
  <label>shake seconds <input id="dur" type="range" min="0" max="150" step="5" value="12">
    <output id="durOut">0.12</output></label>
  <label><input id="square" type="checkbox"> scatter into a square (the naive way)</label>
</div>
<p><strong>Click the canvas.</strong></p>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const countIn = document.getElementById("count");
  const strIn = document.getElementById("str");
  const durIn = document.getElementById("dur");
  const squareIn = document.getElementById("square");

  countIn.oninput = () => document.getElementById("countOut").textContent = countIn.value;
  strIn.oninput   = () => document.getElementById("strOut").textContent = strIn.value;
  durIn.oninput   = () => document.getElementById("durOut").textContent = (durIn.value / 1000).toFixed(2);

  // ---- PARTICLES -------------------------------------------------------
  const particles = [];
  const PARTICLE_LIFE = 0.5;        // seconds

  function spawnParticles(x, y, count) {
    for (let i = 0; i < count; i++) {
      let speedX, speedY;

      if (squareIn.checked) {
        // THE NAIVE WAY: pick x and y separately. This scatters into a SQUARE,
        // with more particles heading diagonally than straight, because the
        // corners of a square are further from the centre than its edges.
        speedX = (Math.random() - 0.5) * 400;
        speedY = (Math.random() - 0.5) * 400;
      } else {
        // THE RIGHT WAY: pick an ANGLE, then convert it into x and y.
        // Math.PI * 2 is a full turn, measured in radians.
        // cos gives you "across", sin gives you "down".
        const angle = Math.random() * Math.PI * 2;
        const speed = 60 + Math.random() * 180;
        speedX = Math.cos(angle) * speed;
        speedY = Math.sin(angle) * speed;
      }

      particles.push({ x: x, y: y, speedX: speedX, speedY: speedY, life: PARTICLE_LIFE });
    }
  }

  function updateParticles(dt) {
    // LOOP BACKWARDS.
    // If you loop forwards and remove an item, everything after it shuffles
    // down by one index - so the loop skips the next particle entirely, and
    // about half of them never get removed. Going backwards means a removal
    // can never affect an index you have not reached yet.
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.speedX * dt;
      p.y += p.speedY * dt;
      p.speedY += 300 * dt;          // a little gravity, so they fall
      p.life -= dt;
      if (p.life <= 0) {
        particles.splice(i, 1);
      }
    }
  }

  // ---- SCREEN SHAKE ----------------------------------------------------
  let shakeTime = 0;
  let shakeStrength = 0;
  let shakeTotal = 0.12;

  function addShake(strength, duration) {
    // Take the BIGGER of old and new, so a small shake cannot cancel a big one
    // that is already running.
    shakeStrength = Math.max(shakeStrength, strength);
    shakeTime = Math.max(shakeTime, duration);
    shakeTotal = Math.max(shakeTotal, duration);
  }

  canvas.addEventListener("mousedown", function (event) {
    const b = canvas.getBoundingClientRect();
    const x = event.clientX - b.left;
    const y = event.clientY - b.top;
    spawnParticles(x, y, Number(countIn.value));
    addShake(Number(strIn.value), Number(durIn.value) / 1000);
  });

  // ---- RENDER ----------------------------------------------------------
  function render() {
    ctx.save();          // remember the current origin

    if (shakeTime > 0 && shakeTotal > 0) {
      // Random offset that shrinks as the shake runs out.
      const fade = shakeTime / shakeTotal;
      const dx = (Math.random() - 0.5) * 2 * shakeStrength * fade;
      const dy = (Math.random() - 0.5) * 2 * shakeStrength * fade;
      ctx.translate(dx, dy);      // moves EVERYTHING drawn from here on
    }

    ctx.fillStyle = "#15181d";
    ctx.fillRect(-40, -40, canvas.width + 80, canvas.height + 80);

    // something to shake
    ctx.strokeStyle = "#2c3340";
    ctx.lineWidth = 2;
    for (let gx = 20; gx < canvas.width; gx += 40) {
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, canvas.height); ctx.stroke();
    }
    for (let gy = 20; gy < canvas.height; gy += 40) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(canvas.width, gy); ctx.stroke();
    }

    for (const p of particles) {
      // remaining / total gives a number sliding from 1 to 0. That pattern is
      // behind every fade, health bar and loading bar you have ever seen.
      ctx.globalAlpha = p.life / PARTICLE_LIFE;
      ctx.fillStyle = "#ffd43b";
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    ctx.restore();       // put the origin back.
    // FORGET THIS LINE and every frame's offset adds to the last one, so the
    // whole game slides off the screen within about a second.

    ctx.fillStyle = "#888";
    ctx.font = "13px ui-monospace, Menlo, monospace";
    ctx.fillText("particles alive: " + particles.length, 12, 20);
  }

  let lastTime = 0;
  function frame(currentTime) {
    if (!lastTime) { lastTime = currentTime; }
    let dt = (currentTime - lastTime) / 1000;
    lastTime = currentTime;
    if (dt > 0.1) { dt = 1 / 60; }

    updateParticles(dt);
    if (shakeTime > 0) { shakeTime -= dt; }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>

</body>
</html>
