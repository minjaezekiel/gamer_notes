<!doctype html>
<!-- ==========================================================================
     02 - Draw a square, using variables
     Lesson 1, Web Games, Beginner

     WHAT THIS SHOWS:  Putting the square's position in VARIABLES instead of
                       typing the numbers straight into fillRect. That is the
                       whole point of this file, and it is what makes file 03
                       possible at all.
     RUN IT:           Double-click this file.
     CHANGE ME FIRST:  squareX and squareY on lines 40 and 41. Try moving the
                       square to (0, 0). Where does it end up? Try (560, 360).
                       Now try (600, 400) - where did it go, and why?
     ========================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>02 - First square</title>
<style>
  body { background:#f0f0f0; font-family:system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:24px; }
  canvas { border:2px solid #888; }
</style>
</head>
<body>

<h1>02 - A square, drawn from variables</h1>
<canvas id="game" width="600" height="400"></canvas>
<p>The square has not moved yet. But its position is now a number we can change.</p>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  // ---- THE GAME'S STATE ----------------------------------------------
  // "State" means everything the game needs to remember.
  // Right now that is just where the square is, and how big it is.
  let squareX = 50;            // how far ACROSS, in pixels
  let squareY = 180;           // how far DOWN, in pixels
  const SQUARE_SIZE = 40;      // CAPITALS mean "this never changes"

  // ---- DRAW ------------------------------------------------------------
  // Job 1: the background. This also erases anything drawn before.
  ctx.fillStyle = "#222222";
  ctx.fillRect(0, 0, 600, 400);

  // Job 2: the square.
  // Notice that squareX and squareY go in here instead of plain numbers.
  // That looks like extra typing for no gain right now. It is the reason
  // the next file can make the square move: a number in a variable is a
  // number you are allowed to change.
  ctx.fillStyle = "#4a9eff";
  ctx.fillRect(squareX, squareY, SQUARE_SIZE, SQUARE_SIZE);
</script>

</body>
</html>
